<svg viewBox="0 0 480 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="f2"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#00000016"/></filter>
  </defs>

  <!-- LEAF right large -->
  <g transform="translate(388,106)">
    <path d="M0 0 Q48 28 36 82 Q18 58 0 0Z" fill="#2E7D32"/>
    <path d="M0 0 Q-12 46 36 82 Q14 64 0 0Z" fill="#388E3C"/>
    <line x1="0" y1="0" x2="36" y2="82" stroke="#1B5E20" stroke-width="2.5"/>
    <path d="M36 82 Q58 108 46 130 Q28 106 36 82Z" fill="#43A047"/>
    <path d="M46 130 Q62 150 54 168 Q38 150 46 130Z" fill="#2E7D32"/>
  </g>
  <!-- LEAF right small -->
  <g transform="translate(414,172)">
    <path d="M0 0 Q34 18 26 64 Q12 44 0 0Z" fill="#43A047"/>
    <line x1="0" y1="0" x2="26" y2="64" stroke="#2E7D32" stroke-width="2"/>
  </g>

  <!-- PADLOCK top right -->
  <g transform="translate(348,12)">
    <rect x="0" y="32" width="64" height="54" rx="11" fill="#43A047"/>
    <rect x="9" y="42" width="46" height="36" rx="8" fill="#2E7D32"/>
    <!-- shackle -->
    <path d="M14 32 Q14 6 32 6 Q50 6 50 32" stroke="#4CAF50" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- keyhole circle -->
    <circle cx="32" cy="57" r="9" fill="#263238"/>
    <rect x="28" y="62" width="8" height="12" rx="2" fill="#263238"/>
  </g>

  <!-- LARGE PHONE body -->
  <rect x="112" y="14" width="214" height="418" rx="30" fill="#263238" filter="url(#f2)"/>
  <!-- notch -->
  <path d="M178 14 Q219 6 260 14 Q252 32 219 32 Q186 32 178 14Z" fill="#37474F"/>
  <!-- white screen -->
  <rect x="122" y="38" width="194" height="384" rx="20" fill="#fff"/>

  <!-- avatar -->
  <circle cx="219" cy="92" r="24" fill="#43A047" opacity="0.18"/>
  <circle cx="219" cy="86" r="13" fill="#4CAF50"/>
  <path d="M199 110 Q201 97 219 97 Q237 97 239 110" fill="#4CAF50"/>

  <!-- name bar -->
  <rect x="152" y="124" width="134" height="11" rx="5" fill="#4CAF50"/>

  <!-- label 1 -->
  <rect x="138" y="148" width="60" height="9" rx="4" fill="#4CAF50"/>
  <!-- input 1 highlighted - finger points here -->
  <rect x="138" y="162" width="162" height="30" rx="7" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="146" y="171" width="64" height="8" rx="4" fill="#4CAF50" opacity="0.75"/>

  <!-- label 2 -->
  <rect x="138" y="200" width="80" height="9" rx="4" fill="#4CAF50"/>
  <!-- input 2 -->
  <rect x="138" y="214" width="162" height="30" rx="7" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="146" y="223" width="90" height="8" rx="4" fill="#4CAF50" opacity="0.55"/>

  <!-- label 3 -->
  <rect x="138" y="252" width="48" height="9" rx="4" fill="#4CAF50"/>
  <!-- input 3 password -->
  <rect x="138" y="266" width="162" height="30" rx="7" fill="#fff" stroke="#E0E0E0" stroke-width="1.5"/>
  <circle cx="152" cy="281" r="4.5" fill="#263238"/>
  <circle cx="166" cy="281" r="4.5" fill="#263238"/>
  <circle cx="180" cy="281" r="4.5" fill="#263238"/>
  <circle cx="194" cy="281" r="4.5" fill="#263238"/>
  <circle cx="208" cy="281" r="4.5" fill="#263238"/>
  <circle cx="222" cy="281" r="4.5" fill="#263238"/>
  <circle cx="236" cy="281" r="4.5" fill="#263238"/>
  <circle cx="250" cy="281" r="4.5" fill="#263238"/>
  <circle cx="264" cy="281" r="4.5" fill="#263238"/>
  <circle cx="278" cy="281" r="4.5" fill="#263238"/>

  <!-- SIGN UP button -->
  <rect x="138" y="316" width="162" height="40" rx="11" fill="#4CAF50"/>
  <text x="219" y="341" text-anchor="middle" font-size="14" fill="#fff" font-weight="700" letter-spacing="1" font-family="sans-serif">SIGN UP</text>

  <!-- THUMBS UP bubble left -->
  <circle cx="74" cy="228" r="36" fill="none" stroke="#4CAF50" stroke-width="3"/>
  <circle cx="74" cy="228" r="28" fill="#fff" opacity="0.06"/>
  <!-- thumb icon -->
  <path d="M62 236 Q62 225 69 223 Q71 216 78 216 Q83 216 83 221 L88 221 Q93 221 93 226 L93 236 Q93 241 88 241 L64 241 Q62 239 62 236Z" fill="#4CAF50"/>
  <rect x="58" y="224" width="7" height="17" rx="3.5" fill="#4CAF50"/>
  <!-- bubble tail -->
  <path d="M60 248 Q54 258 48 260 Q56 254 62 246Z" fill="#4CAF50" stroke="#4CAF50" stroke-width="1"/>

  <!-- WOMAN body -->
  <!-- ground shadow -->
  <ellipse cx="120" cy="488" rx="74" ry="11" fill="#A5D6A7" opacity="0.45"/>

  <!-- left leg -->
  <path d="M100 380 Q96 422 88 452" stroke="#37474F" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- right leg -->
  <path d="M128 380 Q130 422 136 452" stroke="#263238" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- shoes -->
  <ellipse cx="86" cy="455" rx="22" ry="9" fill="#212121"/>
  <ellipse cx="138" cy="455" rx="22" ry="9" fill="#263238"/>

  <!-- torso green -->
  <rect x="84" y="264" width="72" height="124" rx="22" fill="#43A047"/>

  <!-- right arm pointing at phone -->
  <path d="M156 298 Q176 276 162 252" stroke="#C8956C" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="161" cy="248" r="10" fill="#C8956C"/>
  <!-- pointing finger -->
  <rect x="156" y="232" width="10" height="18" rx="5" fill="#C8956C"/>

  <!-- left arm down relaxed -->
  <path d="M84 296 Q66 308 62 328" stroke="#C8956C" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- hand spread -->
  <circle cx="61" cy="332" r="10" fill="#C8956C"/>
  <rect x="52" y="328" width="7" height="14" rx="3.5" fill="#C8956C"/>
  <rect x="61" y="326" width="7" height="14" rx="3.5" fill="#C8956C"/>
  <rect x="70" y="328" width="7" height="14" rx="3.5" fill="#C8956C"/>

  <!-- neck -->
  <rect x="100" y="248" width="24" height="20" rx="8" fill="#C8956C"/>
  <!-- head -->
  <ellipse cx="112" cy="226" rx="29" ry="30" fill="#C8956C"/>
  <!-- long hair dark -->
  <path d="M83 214 Q85 180 112 178 Q139 180 141 214 Q134 190 112 188 Q90 190 83 214Z" fill="#212121"/>
  <path d="M83 214 Q76 248 80 280 Q87 256 92 234Z" fill="#212121"/>
  <path d="M141 214 Q144 240 142 266 Q136 248 134 228Z" fill="#212121"/>
  <!-- eyes -->
  <ellipse cx="104" cy="225" rx="3.2" ry="3.8" fill="#263238"/>
  <ellipse cx="120" cy="225" rx="3.2" ry="3.8" fill="#263238"/>
  <!-- smile -->
  <path d="M106 237 Q112 244 118 237" stroke="#263238" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- ear -->
  <ellipse cx="83" cy="228" rx="4" ry="7" fill="#B07848"/>
</svg>
