<svg viewBox="0 0 280 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bggrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1C3348"/>
      <stop offset="100%" stop-color="#04090F"/>
    </radialGradient>
    <radialGradient id="cubegrad" cx="45%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#1E3E56"/>
      <stop offset="100%" stop-color="#061420"/>
    </radialGradient>
    <radialGradient id="reflgrad" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#0D2840" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020810" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="logograd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F0F8"/>
      <stop offset="100%" stop-color="#B8CAD8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer card background -->
  <rect x="1" y="1" width="278" height="208" rx="22" fill="url(#bggrad)"/>

  <!-- inner 3D cube -->
  <rect x="52" y="24" width="176" height="140" rx="20" fill="url(#cubegrad)"/>
  <!-- cube top highlight edge -->
  <rect x="52" y="24" width="176" height="5" rx="3" fill="#1C4A6A" opacity="0.8"/>
  <!-- cube left highlight -->
  <rect x="52" y="24" width="5" height="140" rx="3" fill="#1C4A6A" opacity="0.5"/>
  <!-- inner shadow bottom -->
  <rect x="52" y="144" width="176" height="20" rx="10" fill="#020C16" opacity="0.6"/>

  <!-- bottom reflection / shadow blob -->
  <ellipse cx="140" cy="180" rx="72" ry="16" fill="#081826" opacity="0.9"/>
  <ellipse cx="140" cy="183" rx="48" ry="10" fill="#0A2035" opacity="0.75"/>
  <!-- reflection glow teal -->
  <ellipse cx="140" cy="185" rx="32" ry="6" fill="#0D3050" opacity="0.5"/>

  <!-- TESLA T LOGO -->
  <g transform="translate(140,88)" filter="url(#glow)">
    <!-- outer top arc with serifs -->
    <path d="M-40 -36 Q-40 -54 0 -54 Q40 -54 40 -36 Q22 -42 0 -42 Q-22 -42 -40 -36Z"
      fill="url(#logograd)"/>
    <!-- left serif arm -->
    <path d="M-40 -36 Q-50 -30 -54 -22 Q-42 -28 -24 -36Z"
      fill="#C0D0E0"/>
    <!-- right serif arm -->
    <path d="M40 -36 Q50 -30 54 -22 Q42 -28 24 -36Z"
      fill="#C0D0E0"/>
    <!-- vertical stem -->
    <path d="M-11 -42 L-7 28 L0 48 L7 28 L11 -42Z"
      fill="url(#logograd)"/>
    <!-- inner arc shadow for depth -->
    <path d="M-30 -36 Q-30 -46 0 -46 Q30 -46 30 -36 Q18 -41 0 -41 Q-18 -41 -30 -36Z"
      fill="#051018" opacity="0.55"/>
    <!-- stem center highlight -->
    <path d="M-3 -42 L-1 28 L0 48 L1 28 L3 -42Z"
      fill="#fff" opacity="0.2"/>
  </g>

  <!-- subtle ambient glow behind logo -->
  <ellipse cx="140" cy="92" rx="38" ry="44" fill="#0D3A5C" opacity="0.25" filter="url(#softglow)"/>

  <!-- outer card border subtle -->
  <rect x="1" y="1" width="278" height="208" rx="22" fill="none"
    stroke="#0E2236" stroke-width="2.5"/>
</svg>
